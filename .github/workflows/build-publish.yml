name: Build and publish FCC

on:
  workflow_dispatch:
    inputs:
      fcc_version:
        description: "FCC version to build (leave blank to read config/fcc-version.json)"
        required: false
        type: string
        default: ""
      publish_latest:
        description: "Also push the mutable latest tag"
        required: false
        type: boolean
        default: true
      deploy:
        description: "Trigger EasyPanel redeployment after a successful publish"
        required: false
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    tags:
      - "fcc-v*"

# Shared with deploy-easypanel.yml so builds and deploys never overlap.
concurrency:
  group: fcc-release-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-publish:
    name: Build, smoke-test, publish, deploy
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.config.outputs.image_tag }}
      image_ref: ${{ steps.config.outputs.image_ref }}
      version: ${{ steps.config.outputs.version }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build configuration
        id: config
        env:
          INPUT_FCC_VERSION: ${{ inputs.fcc_version || '' }}
          INPUT_PUBLISH_LATEST: ${{ inputs.publish_latest }}
          INPUT_DEPLOY: ${{ inputs.deploy }}
          DEPLOY_ON_PUBLISH: ${{ vars.DEPLOY_ON_PUBLISH }}
        run: |
          set -euo pipefail

          is_true() {
            case "${1:-}" in
              true | True | TRUE | 1 | yes | YES) return 0 ;;
              *) return 1 ;;
            esac
          }

          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          version="${INPUT_FCC_VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#fcc-v}"
          fi

          if [[ -z "${version}" ]]; then
            version="$(python3 -c 'import json; print(json.load(open("config/fcc-version.json", encoding="utf-8"))["version"])')"
          fi

          if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Invalid FCC version: ${version}" >&2
            exit 1
          fi

          image_repo="ghcr.io/${owner}/free-claude-code"
          deploy_tag="sha-${short_sha}"
          version_image="${image_repo}:${version}"
          sha_image="${image_repo}:${deploy_tag}"

          publish_latest=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if is_true "${INPUT_PUBLISH_LATEST}"; then publish_latest=true; fi
          else
            publish_latest=true
          fi

          deploy=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if is_true "${INPUT_DEPLOY}"; then deploy=true; fi
          elif is_true "${DEPLOY_ON_PUBLISH}"; then
            deploy=true
          fi

          {
            printf 'version=%s\n' "${version}"
            printf 'image_repo=%s\n' "${image_repo}"
            printf 'image_tag=%s\n' "${deploy_tag}"
            printf 'image_ref=%s\n' "${sha_image}"
            printf 'version_image=%s\n' "${version_image}"
            printf 'short_sha=%s\n' "${short_sha}"
            printf 'deploy=%s\n' "${deploy}"
            printf 'source_url=https://github.com/%s\n' "${GITHUB_REPOSITORY}"
            printf 'tags<<EOF\n'
            printf '%s\n' "${version_image}" "${sha_image}"
            if [[ "${publish_latest}" == "true" ]]; then
              printf '%s\n' "${image_repo}:latest"
            fi
            printf 'EOF\n'
          } >> "${GITHUB_OUTPUT}"

          echo "FCC version: ${version}"
          echo "Immutable deploy tag: ${deploy_tag}"
          echo "Immutable image reference: ${sha_image}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/fcc/Dockerfile
          platforms: linux/amd64
          load: true
          tags: fcc-smoke:${{ steps.config.outputs.short_sha }}
          build-args: |
            FCC_VERSION=${{ steps.config.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ steps.config.outputs.source_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test before publishing
        env:
          FCC_VERSION_EXPECTED: ${{ steps.config.outputs.version }}
        run: |
          bash scripts/smoke-test.sh "fcc-smoke:${{ steps.config.outputs.short_sha }}"
          FCC_SMOKE_AUTH=false bash scripts/smoke-test.sh "fcc-smoke:${{ steps.config.outputs.short_sha }}"

      - name: Validate Compose configuration
        env:
          NVIDIA_NIM_API_KEY: smoke-test-placeholder
          PAPERCLIP_PUBLIC_URL: https://paperclip.example.com
          BETTER_AUTH_SECRET: smoke-test-placeholder
          PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: smoke-test-placeholder
        run: |
          docker compose -f deploy/docker-compose.yml config --quiet
          docker compose -f deploy/fcc-only.yml config --quiet
          for script in scripts/*.sh; do bash -n "$script"; done
          env -u EASYPANEL_DEPLOY_URL bash scripts/deploy.sh sha-smoke

      - name: Push multi-arch image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/fcc/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.config.outputs.tags }}
          build-args: |
            FCC_VERSION=${{ steps.config.outputs.version }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ steps.config.outputs.source_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report final image tag
        if: github.event_name != 'pull_request'
        id: final
        env:
          IMAGE_TAG: ${{ steps.config.outputs.image_tag }}
          IMAGE_REF: ${{ steps.config.outputs.image_ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Final immutable image tag: ${IMAGE_TAG}"
          echo "Final image reference: ${IMAGE_REF}"
          echo "Digest: ${DIGEST}"
          printf 'image_tag=%s\n' "${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          printf 'image_ref=%s\n' "${IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Mask EasyPanel deployment URL
        if: ${{ success() && steps.config.outputs.deploy == 'true' }}
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          if [[ -n "${EASYPANEL_DEPLOY_URL:-}" ]]; then
            printf '::add-mask::%s\n' "${EASYPANEL_DEPLOY_URL}"
          fi

      - name: Trigger EasyPanel redeployment
        if: ${{ success() && steps.config.outputs.deploy == 'true' }}
        env:
          IMAGE_TAG: ${{ steps.config.outputs.image_tag }}
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
          EASYPANEL_DEPLOY_METHOD: ${{ vars.EASYPANEL_DEPLOY_METHOD || 'POST' }}
        run: bash scripts/deploy.sh "${IMAGE_TAG}"
